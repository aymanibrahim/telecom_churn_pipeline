name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install GDAL/GEOS for geopandas
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev gdal-bin libgeos-dev libproj-dev

      - name: Install pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-pipeline.txt
          pip install pytest pytest-cov ruff mypy

      - name: Lint with ruff
        run: ruff check src scripts dags tests

      - name: Type check with mypy (non-blocking)
        run: mypy src --ignore-missing-imports --no-strict-optional || true
        continue-on-error: true

      - name: Compile every Python file
        run: python -m compileall -q src scripts dags tests

      - name: Run unit tests
        run: pytest --cov=src --cov-report=term-missing -m "not requires_airflow"
        env:
          CHURN_BASE_DIR: ${{ github.workspace }}

  airflow-dag-parse:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install GDAL/GEOS
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev gdal-bin libgeos-dev libproj-dev

      - name: Install Airflow + pipeline deps
        run: |
          python -m pip install --upgrade pip
          pip install "apache-airflow==2.10.4"
          pip install -r requirements-pipeline.txt

      - name: Parse the DAG (catches import errors)
        run: |
          export CHURN_BASE_DIR=$GITHUB_WORKSPACE
          export AIRFLOW_HOME=$GITHUB_WORKSPACE/.airflow
          airflow db migrate
          airflow dags list-import-errors
          airflow dags list | grep telecom_churn_production_pipeline
