# Non-path configuration for the Telecom Customer Churn pipeline.
# All file paths live in src/paths.py and are derived from CHURN_BASE_DIR.

opencellid:
  mcc: 608               # Senegal mobile country code
  mnc: 3                 # Expresso mobile network code
  window_days: 90
  ref_window_start: "2019-04-01"
  ref_window_end:   "2019-07-01"

sample:
  n: 100000
  stratify_col: CHURN
  seed: 42
  input_chunksize: 200000
  input_estimated_rows: 2000000

model:
  target: churn
  test_size: 0.15
  val_size: 0.15
  default_threshold: 0.42
  calibration_method: isotonic
  smote_k_neighbors: 5
  # n_iter_search lowered from 20 to 5 so Airflow's heartbeat doesn't kill
  # the train_model task. Bump back to 20 when running outside Docker.
  n_iter_search: 5
  cv_folds: 5
  shap_sample_size: 1000
  lgbm_param_grid:
    clf__n_estimators:     [200, 400, 600]
    clf__max_depth:        [5, 7, 10, -1]
    clf__num_leaves:       [30, 60, 120]
    clf__learning_rate:    [0.03, 0.05, 0.1]
    clf__subsample:        [0.7, 0.8, 1.0]
    clf__colsample_bytree: [0.7, 0.8, 1.0]

business:
  cost_per_campaign: 10.0      # USD
  customer_lifetime_value: 200.0
  risk_tiers:
    High:   [0.70, 1.01]
    Medium: [0.40, 0.70]
    Low:    [0.00, 0.40]

drop_columns:
  zero_variance:
    - mrg
    - region_avg_signal
    - region_signal_strength_index
    - department_signal_strength_index
    - arr_signal_strength_index
  collinear:
    - arr_coverage_index
    - department_coverage_index
    - department_network_quality_score
  sparse:
    - zone1
    - zone2
  id:
    - user_id
