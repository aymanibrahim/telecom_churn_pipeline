# docker-compose.yml
# ------------------
# Telecom AI-Enhanced Data Pipeline — Local / Azure VM deployment
#
# Services
# --------
#   postgres         : Airflow metadata database (replaces Huawei RDS)
#   airflow-init     : One-shot container that initialises the DB and creates
#                      the admin user
#   airflow-webserver: Airflow UI on port 8080
#   airflow-scheduler: Task scheduler
#   flask-api        : REST API for churn predictions on port 5000
#
# Usage
# -----
#   1.  Copy .env.example → .env and fill in credentials.
#   2.  docker compose up airflow-init   (once)
#   3.  docker compose up -d
#   4.  Browse http://localhost:8080  (user: airflow / password: airflow)
#   5.  Browse http://localhost:5000/health to verify the Flask API.

version: "3.8"

x-airflow-common: &airflow-common
  image: apache/airflow:2.7.0-python3.10
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW_FERNET_KEY:-}"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: "${AIRFLOW_SECRET_KEY:-changeme}"
    AIRFLOW__EMAIL__EMAIL_BACKEND: airflow.utils.email.send_email_smtp
    AIRFLOW__SMTP__SMTP_HOST: "${SMTP_HOST:-smtp.example.com}"
    AIRFLOW__SMTP__SMTP_PORT: "${SMTP_PORT:-587}"
    AIRFLOW__SMTP__SMTP_USER: "${SMTP_USER:-}"
    AIRFLOW__SMTP__SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
    AIRFLOW__SMTP__SMTP_MAIL_FROM: "${NOTIFY_EMAIL_FROM:-airflow@example.com}"
    # Pipeline environment variables
    TELECOM_BASE_DIR: /opt/airflow
    TELECOM_PROJECT_ROOT: /opt/airflow
    NOTIFY_EMAIL_TO: "${NOTIFY_EMAIL_TO}"
    # Azure Blob Storage 
    AZURE_STORAGE_CONNECTION_STRING: "${AZURE_STORAGE_CONNECTION_STRING:-}"
    AZURE_CONTAINER_RAW: "${AZURE_CONTAINER_RAW:-raw-data}"
    AZURE_CONTAINER_PROCESSED: "${AZURE_CONTAINER_PROCESSED:-processed-data}"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./config:/opt/airflow/config
    - ./data:/opt/airflow/data
    - ./models:/opt/airflow/models
    - ./outputs:/opt/airflow/outputs
    - ./logs:/opt/airflow/logs
    - airflow_plugins:/opt/airflow/plugins
  depends_on:
    postgres:
      condition: service_healthy
  user: "${AIRFLOW_UID:-50000}:0"
  networks:
    - telecom_net

services:

  # ── Metadata database ──────────────────────────────────────────────────────
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    networks:
      - telecom_net

  # ── One-shot DB initialiser ────────────────────────────────────────────────
  airflow-init:
    <<: *airflow-common
    command: >
      bash -c "
        airflow db init &&
        airflow users create
          --username airflow
          --password airflow
          --firstname Admin
          --lastname User
          --role Admin
          --email admin@example.com
      "
    profiles:
      - init

  # ── Webserver ──────────────────────────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── Scheduler ─────────────────────────────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob", "--hostname", "$${HOSTNAME}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── Flask REST API ─────────────────────────────────────────────────────────
  flask-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "5000:5000"
    environment:
      MODELS_DIR: /app/models
      OUTPUTS_DIR: /app/outputs
    volumes:
      - ./models:/app/models:ro
      - ./outputs:/app/outputs:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - telecom_net

volumes:
  postgres_data:
  airflow_plugins:

networks:
  telecom_net:
    driver: bridge
